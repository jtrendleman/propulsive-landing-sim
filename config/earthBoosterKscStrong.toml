[environment]
gravity = 9.81                         # m/s^2, constant for now
# International Standard Atmosphere troposphere (U.S. Standard Atmosphere 1976): T = T0 - L h, p = p0 (T/T0)^(g/(R L)), rho = p/(R T).
seaLevelPressure = 101325.0            # Pa
seaLevelTemperature = 288.15           # K
lapseRate = 0.0065                     # K/m
gasConstant = 287.05                   # J/(kg K), dry air
padSlope = 0.0                         # rad, landing pad tilt; Monte Carlo draws it
padSlopeDirection = 0.0                # rad from +x, downhill direction of the pad

[environment.wind]
# Kennedy Space Center strong-wind case: a windy day well inside the commit limit (7.5 m/s at 10 m, 14 m/s at 1000 m),
# roughly the 95th percentile of the average-case draw. The training target between the average and extreme cases.
meanSpeed = 7.5                        # m/s at referenceHeight; Monte Carlo draws max(N(meanSpeed, gustStd), 0) per episode
gustStd = 1.0                          # m/s, 1 sigma of the per-episode speed draw (E: a fixed wind day; 1 m/s covers the day-to-forecast variation)
direction = 0.0                        # rad from +x, nominal wind direction (the wind blows toward this direction)
referenceHeight = 10.0                 # m, anemometer height the speed is quoted at
profileExponent = 0.14                 # power-law (Hellmann) exponent, neutral air over open terrain
turbulenceIntensity = 0.15             # gust sigma as a fraction of the local mean speed (E: middle of 0.1-0.2 [22][25])
turbulenceLength = 200.0               # m, gust scale length; with the local wind speed it sets the gust correlation time
verticalGustFraction = 0.5             # vertical gust sigma relative to horizontal
directionShearPerKm = 0.35             # rad per km of altitude, Ekman turning of the wind direction (E: 20 deg across the ~1 km boundary layer, inside 10-30 deg [26])
boundaryLayerHeight = 1000.0           # m, top of the atmospheric boundary layer; the profile and the veer stop here and the wind holds its value above (E: ~1 km Ekman layer [26])

# Falcon 9-class booster, modelled after the Falcon 9 Block 5 first stage on its single-engine landing burn.
# [n] = docs/references.txt entry. S = published figure, D = derived from published figures or telemetry,
# E = engineering estimate with its reasoning; no flight-hardware figure is published for those.

[spacecraft.mass]
dryMass = 25600.0                      # kg, Block 5 first stage [15] (S; v1.2 was 22,200 kg [2])
cgHeightDry = 18.2                     # m above the engine base (D): 9 x 470 kg engines [5] + 2 t thrust structure + 2.1 t legs [17] at 1.5 m, 13.8 t tank structure spread 3-41 m, 3.5 t interstage, fins and RCS at 43 m
cgLateralOffset = [0.0, 0.0]           # m, dry CG offset from the body axis in body [x, y]; Monte Carlo draws it
inertiaDry = [6.3e6, 6.3e6, 6.0e4]     # kg*m^2 about the dry CG, body [x, y, z] (D): the same mass groups by the parallel-axis theorem; roll from the 1.83 m shell

[spacecraft.propellant]
initialMass = 8000.0                   # kg at mission start (D): a 32 s landing burn [7][D1] at ~70 % mean throttle burns ~6.9 t at 305 kg/s full flow, plus ~1 t left at touchdown [D3]
mixtureRatio = 2.33                    # oxidizer / fuel by mass (D): 287.4 t LOX / 123.5 t RP-1 capacity [16]
sloshEnabled = true                    # one SP-106 equivalent pendulum per tank [13]
sloshDamping = 0.04                    # damping ratio, baffled tanks as on large launch vehicles (E: middle of the 0.03-0.05 baffled range [23]; assumes the baffles still reach the residual in the dome)

[spacecraft.propellant.oxidizer]
density = 1240.0                       # kg/m^3, densified LOX at 66.5 K [16][27] (S)
tankBottomHeight = 18.6                # m, lowest point of the LOX tank's lower dome (D: fuel tank top at 18.1 m plus a 0.5 m intertank; the 232 m^3 LOX tank then tops out at 41.7 m against the 41.2 m stage [1])
tankRadius = 1.825                     # m, inner radius (D: 3.66 m outer diameter [15] less the wall)
domeRatio = 0.707                      # dome depth / radius (E: the standard elliptical bulkhead)

[spacecraft.propellant.fuel]
density = 828.0                        # kg/m^3, chilled RP-1 at 266.5 K [16] (D: 810 at 15 C + 0.8 per K)
tankBottomHeight = 3.0                 # m, lowest point of the RP-1 tank's lower dome (E: engine and thrust section below it); 149 m^3 tops out at 18.1 m (D)
tankRadius = 1.825                     # m, inner radius (D, as above)
domeRatio = 0.707                      # (E, as above)

[spacecraft.engine]
count = 1                              # centre Merlin only on the landing burn [7][8] (S)
maxThrust = 845000.0                   # N at sea level [5] (S)
minThrottle = 0.57                     # 482 kN [6] (S)
isp = 282.0                            # s at sea level [5][16] (S)
maxGimbalAngle = 0.0873                # rad (5 deg) (E: no public Merlin figure; large engines gimbal 5-6 deg)
maxGimbalRate = 0.3491                 # rad/s (20 deg/s) (E: hydraulic TVC of large boosters slews 15-30 deg/s)
throttleTimeConstant = 0.2             # s, commanded to achieved throttle (E: gas-generator engines respond in 0.1-0.3 s)
ignitionDelay = 1.0                    # s, relight command to thrust onset (E: TEA-TEB relight; 0.5-1.5 s, no published timing)
nozzleExitArea = 0.86                  # m^2 (D): (vacuum - sea-level thrust) / p0 with vacuum thrust 845 kN x 311 / 282 [16]
thrustMisalignment = [0.0, 0.0]        # rad, fixed thrust-vector error added to the gimbal in body [x, y]; Monte Carlo draws it

[spacecraft.rcs]
thrusterCount = 8                      # cold-gas thrusters in two pods at the top of the interstage [3] (S, aggregator)
thrustPerThruster = 1500.0             # N (E: 1-3 kN, sized from a ~20 s 180 deg flip of the stage)
momentArm = 31.0                       # m from the CG (D: 47.7 m interstage top less the ~17 m wet CG)

[spacecraft.aero]
dragCoefficient = 0.87                 # base-first (D): m / (Cd A) = 2100 kg/m^2 in the pre-ignition fall [D2] at 33.6 t over 10.52 + 7.8 m^2
referenceArea = 10.52                  # m^2, body cross-section (D: 3.66 m diameter [15])
gridFinArea = 7.8                      # m^2, four fins of ~1.95 m^2 [18][19] (S)
cpHeight = 4.0                         # m above the engine base, centre of pressure at small angle of attack (E: slender-body lift sits at the leading end, which flying base-first is the engine section; the fins, not the body, keep it stable)
dragAlphaFactor = 5.6                  # Cd(alpha) = Cd (1 + factor sin^2 alpha) (D): post-critical crossflow Cd ~0.7 [21] on the 151 m^2 side area, against 0.87 on 18.3 m^2 axially
cpHeightCrossflow = 20.6               # m, centre of pressure in pure crossflow (D: centroid of the 41.2 m body's side area)
finHeight = 42.0                       # m above the engine base, grid-fin hinge line (D: base of the interstage [1])
finLiftSlope = 2.0                     # per rad, fin side-force coefficient slope (E: Washington & Miller grid-fin data, order of magnitude)
maxFinDeflection = 0.35                # rad (20 deg) (E: no public limit)
finMinDynamicPressure = 5200.0         # Pa, fin/gimbal authority crossover (D: fin torque q x 7.8 m^2 x 2 x 0.35 rad x 25 m equals the gimbal's 482 kN x sin 5 deg x 17 m at 5.2 kPa); the fins lead above twice this and hand over below
plumeDragFactor = 0.0                  # fraction of body drag left while the engine fires (S: at high thrust coefficients, ~1.3 here at ignition, a central nozzle leaves no aerodynamic drag [31]; D: the telemetry burn needs most of it gone [D4])

[spacecraft.landingGear]
strutCount = 4                         # (S)
strutStroke = 0.40                     # m, usable travel (E: 0.3-0.5 m for a crush-core telescoping strut [15])
strutCrossSection = 0.0075             # m^2, load-bearing area (E: 0.25 m carbon-fibre tube with a 10 mm wall)
strutStiffness = 571000.0              # N/m per leg (D): a 3 m/s touchdown of 26 t absorbed in 80 % of the stroke, ~2.9 g peak
strutDamping = 36600.0                 # N*s/m per leg (D): damping ratio 0.3 on a quarter of the landing mass
footRadius = 9.0                       # m, foot distance from the axis (S: ~18 m span [17][9])
footFriction = 37000.0                 # N*s/m per foot, damper on the friction spring (D: damping ratio ~0.3 on a quarter of the landing mass, as the struts)
frictionCoefficient = 0.6              # steel foot on concrete pad, Coulomb friction
tangentialStiffness = 571000.0         # N/m per foot, stick-slip friction spring to the foot's anchor (D: equal to the strut stiffness; ~53 rad/s in yaw, far inside RK4's limit at the 2.5 ms contact substep)
strutHardening = 1.0                   # progressive spring: F = k x (1 + strutHardening (x / stroke)^2) (E: crush cores stiffen as they bottom out)

[spacecraft.geometry]
bodyLength = 47.7                      # m, engine base to interstage top, used by the viewer (D: 41.2 m stage [1] + interstage)
bodyRadius = 1.83                      # m, outer skin radius (S: 3.66 m diameter [15])

[spacecraft.structure]
yieldStrength = 600.0e6                # Pa, quasi-isotropic carbon fibre [21] (E: datasheet range 600-900 MPa)
factorOfSafety = 1.5                   # dimensionless, applied to yield
loadFactorLimit = 5.0                  # g, max allowed sensed acceleration (E: 4-6 g; a 6 m/s touchdown over 0.4 m is ~4.6 g)

[mission]
maxTime = 120.0                        # s, episode cutoff
initialAltitude = 6000.0               # m, feet altitude at mission start (S: CRS-12 telemetry at 6.1 km [11]); ignition is observed at 4.3-5 km [D1], so the controller picks its own
initialVerticalSpeed = -350.0          # m/s (S: 351 m/s at 6.1 km on CRS-12 [11])
initialHorizontalOffset = 100.0        # m from the pad after the boostback (E: no public figure; well inside what the fins and engine can remove from 6 km)

[monteCarlo]
episodes = 50                          # default episode count for scripts/runMonteCarlo.py
seed = 0                               # base RNG seed
thrustStd = 0.05                       # fraction of maxThrust, 1 sigma
dryMassStd = 0.05                      # fraction of dryMass, 1 sigma
cgOffsetStd = 0.20                     # m, added to cgHeightDry, 1 sigma
initialOffsetStd = 50.0                # m, added to initialHorizontalOffset, 1 sigma (E: half the nominal miss)
randomWindDirection = true             # draw the wind direction uniformly per episode (false keeps wind.direction)
cgLateralStd = 0.02                    # m, 1 sigma per axis of the dry CG lateral offset
thrustMisalignmentStd = 0.00175        # rad (0.1 deg), 1 sigma per axis of the thrust misalignment
padSlopeStd = 0.01                     # rad (0.6 deg), 1 sigma of the pad slope; direction drawn uniformly

[rl]
decisionInterval = 0.1                 # s, the policy picks a new residual this often
maxResidualAccel = 0.5                 # m/s^2, action in [-1, 1] scales to this; sized to the baseline's residual errors, not its full authority

[guidance]
coast = true                           # engine off until the braking altitude (hoverslam); false = brake from t = 0
referenceDecel = 18.0                  # m/s^2, planned braking deceleration (D: a 20-draw sweep of 15-24 crashes least at 18, where the burn flies mid-throttle; the RTLS burns [D1] stop 310 m/s in ~4 km); the fuel optimizer tunes it
ignitionMargin = 0.15                  # fraction added to the braking altitude before ignition
tgoMin = 1.0                           # s, time-to-go floor
tgoMax = 60.0                          # s, time-to-go ceiling
lateralLead = 10.0                     # s, lateral channel finishes this much before the vertical one; the optimizer tunes it
lateralTgoMin = 5.0                    # s, floor on the lateral time-to-go (D: ZEM/ZEV lateral bandwidth sqrt(6) / tgo held at the 0.5 rad/s position loop)
terminalHeight = 100.0                 # m feet altitude, start of the terminal phase (D: the lateral time-to-go hits its 1 s floor at tgo = lateralLead + tgoMin = 4 s, ~70 m at the burn's ~9 m/s^2; 100 m adds margin)
descentRate = -1.0                     # m/s, terminal descent speed command
alignSpeed = 0.0                       # m/s, hover-and-align hold (0 disables; a booster that cannot hover cannot hold)
alignOffset = 0.0                      # m, hover-and-align hold (0 disables, as above)
holdPropellantFloor = 0.10             # fraction of loaded propellant below which the alignment hold gives up and descends
alignHoldHeight = 2.0                  # m feet altitude the alignment hold servos to; low enough to save fuel, high enough that a lean cannot touch a foot
kHold = 1.0                            # 1/s, gain from height error to commanded descent rate while holding
kDescent = 3.0                         # 1/s, vertical speed gain in the terminal phase
kDescentIntegral = 1.0                 # 1/s^2, vertical speed integral gain; trims out thrust and mass error so the hold can hover
descentIntegralLimit = 3.0             # m/s^2, anti-windup clamp on the vertical integral term
kPosition = 0.25                       # 1/s^2, terminal lateral position gain (D: position loop at 0.5 rad/s, four times below the attitude loop)
kVelocity = 0.8                        # 1/s, terminal lateral velocity gain (D: damping ratio 0.8 at 0.5 rad/s)
kIntegral = 0.03                       # 1/s^3, lateral integral gain (D: integral corner a decade below the position loop)
integralHeight = 30.0                  # m feet altitude below which the lateral integral accumulates
integralLimit = 1.0                    # m/s^2, anti-windup clamp on the integral term
minVerticalAccel = 3.0                 # m/s^2, floor on the commanded vertical acceleration while the engine is on
maxTilt = 0.2618                       # rad, thrust-vector tilt limit at the ground (15 deg)
highTilt = 0.5236                      # rad, tilt limit above tiltAltitude (30 deg)
tiltAltitude = 50.0                    # m, altitude where the tilt limit reaches highTilt
cutoffHeight = 0.10                    # m feet altitude, engine cutoff latch; the vehicle free-falls from here, so this sets the touchdown speed
cutoffSpeed = 3.0                      # m/s, cutoff only if descending slower than this
kp = 4.0                                # rad/s^2 per rad, attitude proportional gain (D: 2 rad/s bandwidth; 5 deg of gimbal at the 482 kN floor gives ~0.10 rad/s^2 on 7e6 kg m^2, enough for the ~1.5 deg errors near the end)
kd = 3.2                                # rad/s^2 per rad/s, attitude rate gain (D: damping ratio 0.8)
windFeedforwardGain = 1.0              # fraction of the observed wind push the guidance leans against (0 disables)

[windSchedule]
# Wind-scheduled guidance: the flight software blends the guidance knobs below between their [guidance] values
# (at averageWindSpeed) and these strong-wind values (at strongWindSpeed), by its real-time wind estimate:
# the forecast at first, corrected by the wind the IMU observes, taking the part blowing away from the pad.
# Blend factor s = clip((estimate - averageWindSpeed) / (strongWindSpeed - averageWindSpeed), 0, 1).
enabled = false
averageWindSpeed = 4.5                 # m/s at the wind referenceHeight, s = 0 (KSC average)
strongWindSpeed = 7.5                  # m/s at the wind referenceHeight, s = 1 (KSC strong)
minAirspeed = 20.0                     # m/s, below this the IMU push is too small to read as wind; the estimate holds
padRadius = 5.0                        # m, inside this the away-from-pad part fades to the full speed (no direction at the pad)
referenceDecel = 18.0
ignitionMargin = 0.15
lateralLead = 10.0
maxTilt = 0.2618
highTilt = 0.5236
windFeedforwardGain = 1.0
kPosition = 0.25
kVelocity = 0.8

[sensors]
# What the flight computer actually gets: a navigation-grade IMU [30], RTK GPS against a base station at the
# landing zone [29], a radar altimeter [20], engine chamber pressure, tank gauging and actuator feedback.
enabled = true                         # false = perfect navigation (the controller sees the true state)
gpsRate = 10.0                         # Hz, position and velocity fix rate (S: RTK up to 20 Hz [29])
gpsLatency = 0.1                       # s, age of a fix when it reaches the flight computer (E: one navigation epoch)
gpsPositionNoise = 0.02                # m, 1 sigma per axis (D: 0.01 m + 1 ppm CEP [29] at a 6 km baseline is 0.016 m CEP; rounded up for the vertical axis)
gpsVelocityNoise = 0.05                # m/s, 1 sigma per axis (S [29])
altimeterRange = 1500.0                # m, radar altimeter works below this feet altitude (E: low-range radar altimeters cover 0 to ~1.5 km)
altimeterNoise = 0.3                   # m, 1 sigma floor (E: radar altimeters quote ~0.3 m or 1-2 % of range)
altimeterNoiseFraction = 0.01          # 1 sigma as a fraction of range (E, as above)
accelNoise = 0.02                      # m/s^2, 1 sigma per axis per 100 Hz sample (E: engine vibration after anti-alias filtering dominates; the sensor's own noise is far lower)
accelBias = 0.000245                   # m/s^2, 1 sigma per-episode bias per axis (S: 25 micro-g in-run stability [30])
gyroNoise = 0.0000061                  # rad/s, 1 sigma per axis per 100 Hz sample (D: angle random walk 0.0021 deg/sqrt(h) [30])
gyroBias = 0.0000000102                # rad/s, 1 sigma per-episode bias per axis (S: 0.0021 deg/h [30])
alignmentError = 0.00016               # rad, 1 sigma per axis of the initial attitude (D: gyrocompass heading error = gyro bias / (Earth rate x cos 28.5 deg latitude); tilt error accel bias / g is ten times smaller)
chamberPressureNoise = 0.0025          # fraction of thrust, 1 sigma per sample (E: flight pressure transducers 0.25-0.5 % of full scale)
chamberPressureBias = 0.005            # fraction of thrust, 1 sigma per-episode calibration error (E, as above)
propellantGaugeNoise = 20.0            # kg, 1 sigma per sample (E: 0.25 % of the 8 t landing load)
propellantGaugeBias = 0.02             # fraction of the true load, 1 sigma per-episode gauging error (E: point-level and ullage-pressure gauging, ~2 %)
gimbalSensorNoise = 0.0009             # rad (0.05 deg), 1 sigma of the gimbal position feedback (E: actuator LVDT resolution)
forecastSpeedError = 1.5               # m/s, 1 sigma error of the pre-flight wind forecast (E: balloon sounding hours old)
forecastDirectionError = 0.35          # rad (20 deg), 1 sigma error of the forecast direction (E, as above)
thrustEstimateTimeConstant = 2.0       # s, low-pass on the mass estimate from the IMU (0 disables thrust and mass estimation); a filter design choice
engineEstimateTimeConstant = 0.5       # s, low-pass on the engine-performance estimate from chamber pressure; a filter design choice
windObserverTimeConstant = 3.0         # s, low-pass on the wind-push estimate from IMU, thrust and attitude; a filter design choice
